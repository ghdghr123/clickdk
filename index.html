<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Statistics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-deep: #12040a;
            --bg-mid: #1a0610;
            --bg-light: #2a0a18;
            --card-bg: rgba(42, 10, 24, 0.6);
            --card-border: rgba(255, 45, 85, 0.18);
            --accent-red: #ff2d55;
            --accent-crimson: #e6003c;
            --accent-glow: rgba(255, 45, 85, 0.4);
            --text-primary: #ffe0e6;
            --text-secondary: #c97a8e;
            --text-muted: #8a4458;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 45, 85, 0.18), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(230, 0, 60, 0.12), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(42, 10, 24, 0.9), var(--bg-deep) 80%);
            z-index: -1;
            animation: bgShift 20s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0%   { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(-2%, -2%); }
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 12px 0 24px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 45, 85, 0.18), rgba(230, 0, 60, 0.12));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.08);
            animation: pulseGlow 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .header-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-crimson));
            opacity: 0.15;
            border-radius: inherit;
        }

        .header-icon img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 8px 32px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.08); }
            50%      { box-shadow: 0 8px 48px rgba(255, 45, 85, 0.6), inset 0 1px 0 rgba(255,255,255,0.15); }
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.15s; }
        .stat-card:nth-child(3) { animation-delay: 0.2s; }
        .stat-card:nth-child(4) { animation-delay: 0.25s; }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
            opacity: 0.6;
        }

        .stat-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px var(--accent-glow);
            border-color: rgba(255, 45, 85, 0.45);
        }

        .stat-card .value {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .stat-card .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-container,
        .list-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out backwards;
            animation-delay: 0.3s;
        }

        .chart-container::before,
        .list-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-crimson), transparent);
            opacity: 0.5;
        }

        .chart-container h3,
        .list-container h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }

        .chart-container h3::before,
        .list-container h3::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, var(--accent-red), var(--accent-crimson));
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 45, 85, 0.08);
            font-size: 14px;
            transition: all 0.2s;
        }

        .list-item:last-child { border-bottom: none; }

        .list-item:hover {
            padding-left: 6px;
            background: rgba(255, 45, 85, 0.05);
            border-radius: 8px;
        }

        .list-item .rank {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-crimson));
            color: var(--bg-deep);
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .list-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
            font-weight: 500;
        }

        .list-item .count {
            font-weight: 800;
            color: var(--accent-red);
            margin-left: 12px;
            font-size: 15px;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .loading::before {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid rgba(255, 45, 85, 0.15);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .chart-wrapper {
            position: relative;
            height: 220px;
            width: 100%;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-red), var(--accent-crimson));
            border-radius: 3px;
        }

        @media (max-width: 360px) {
            .stat-card .value { font-size: 24px; }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <img src="/static/statistics-131964743700497111_0px.svg" alt="Statistics">
            </div>
            <h1>Statistics</h1>
            <p>Last 7 days overview</p>
        </div>

        <div id="loading" class="loading">Loading data...</div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="total-clicks">0</div>
                    <div class="label">Clicks</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="total-views">0</div>
                    <div class="label">Views</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="unique-users">0</div>
                    <div class="label">Unique Users</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="conversion">0%</div>
                    <div class="label">Conversion</div>
                </div>
            </div>

            <div class="chart-container">
                <h3>Weekly Activity</h3>
                <div class="chart-wrapper">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <div class="list-container">
                <h3>Top Pages</h3>
                <div id="top-pages"></div>
            </div>

            <div class="list-container">
                <h3>Top Clicks</h3>
                <div id="top-clicks"></div>
            </div>

            <div class="list-container">
                <h3>Recent Events</h3>
                <div id="recent"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#12040a');
            tg.setBackgroundColor('#12040a');
        }

        const CHART_COLORS = {
            red: '#ff2d55',
            crimson: '#e6003c',
            grid: 'rgba(255, 45, 85, 0.08)',
            text: '#c97a8e'
        };

        async function loadStats() {
            try {
                const [summaryRes, dailyRes, recentRes] = await Promise.all([
                    fetch('/api/stats/summary'),
                    fetch('/api/stats/daily'),
                    fetch('/api/stats/recent')
                ]);

                const summary = await summaryRes.json();
                const daily = await dailyRes.json();
                const recent = await recentRes.json();

                animateNumber('total-clicks', summary.total_clicks);
                animateNumber('total-views', summary.total_views);
                animateNumber('unique-users', summary.unique_users);

                const conversion = summary.total_views > 0
                    ? ((summary.total_clicks / summary.total_views) * 100).toFixed(1) + '%'
                    : '0%';
                document.getElementById('conversion').textContent = conversion;

                renderList('top-pages', summary.top_pages, 'page');
                renderList('top-clicks', summary.top_clicks, 'element');
                renderRecent(recent.recent);

                renderChart(daily);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                console.error('Error loading:', error);
                document.getElementById('loading').textContent = 'Failed to load data';
            }
        }

        function animateNumber(elementId, target) {
            const el = document.getElementById(elementId);
            const duration = 800;
            const start = performance.now();

            function update(now) {
                const progress = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(target * eased);
                el.textContent = current.toLocaleString('en-US');
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        function renderList(containerId, items, nameKey) {
            const container = document.getElementById(containerId);
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="list-item"><span class="name">No data</span></div>';
                return;
            }
            container.innerHTML = items.map((item, index) => `
                <div class="list-item">
                    <div class="rank">${index + 1}</div>
                    <span class="name">${item[nameKey] || 'Unknown'}</span>
                    <span class="count">${item.count}</span>
                </div>
            `).join('');
        }

        function renderRecent(items) {
            const container = document.getElementById('recent');
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="list-item"><span class="name">No events</span></div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="list-item">
                    <span class="name">${item.element || '—'} ${item.text ? '· ' + item.text : ''}</span>
                    <span class="count" style="font-size:11px">${item.timestamp.split(' ')[1] || ''}</span>
                </div>
            `).join('');
        }

        function renderChart(daily) {
            const ctx = document.getElementById('dailyChart').getContext('2d');

            const labels = daily.daily_views.map(d => {
                const date = new Date(d.date);
                return date.toLocaleDateString('en-US', { day: '2-digit', month: '2-digit' });
            });
            const viewsData = daily.daily_views.map(d => d.count);
            const clicksData = daily.daily_clicks.map(d => d.count);

            const gradientViews = ctx.createLinearGradient(0, 0, 0, 220);
            gradientViews.addColorStop(0, 'rgba(255, 45, 85, 0.4)');
            gradientViews.addColorStop(1, 'rgba(255, 45, 85, 0)');

            const gradientClicks = ctx.createLinearGradient(0, 0, 0, 220);
            gradientClicks.addColorStop(0, 'rgba(230, 0, 60, 0.4)');
            gradientClicks.addColorStop(1, 'rgba(230, 0, 60, 0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Views',
                            data: viewsData,
                            borderColor: CHART_COLORS.red,
                            backgroundColor: gradientViews,
                            fill: true,
                            tension: 0.4,
                            borderWidth: 2,
                            pointBackgroundColor: CHART_COLORS.red,
                            pointBorderColor: '#12040a',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        },
                        {
                            label: 'Clicks',
                            data: clicksData,
                            borderColor: CHART_COLORS.crimson,
                            backgroundColor: gradientClicks,
                            fill: true,
                            tension: 0.4,
                            borderWidth: 2,
                            pointBackgroundColor: CHART_COLORS.crimson,
                            pointBorderColor: '#12040a',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: CHART_COLORS.text,
                                padding: 16,
                                font: { size: 12, weight: '600' },
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(18, 4, 10, 0.95)',
                            borderColor: CHART_COLORS.red,
                            borderWidth: 1,
                            titleColor: '#ffffff',
                            bodyColor: CHART_COLORS.red,
                            padding: 12,
                            cornerRadius: 8
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: CHART_COLORS.text, font: { size: 11 }, padding: 8 },
                            grid: { color: CHART_COLORS.grid, drawBorder: false }
                        },
                        x: {
                            ticks: { color: CHART_COLORS.text, font: { size: 11 }, padding: 8 },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        loadStats();
    </script>
</body>
</html>
